services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: navya
      POSTGRES_USER: navya
      POSTGRES_PASSWORD: navya
    ports: ["5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navya -d navya"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
